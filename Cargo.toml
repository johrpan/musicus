[workspace]
resolver = "2"
members = ["musicus-library", "musicus-testgen", "."]
default-members = ["musicus-library", "."]

[package]
name = "musicus"
version = "0.2.0"
edition = "2021"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_9", "gtk_v4_22"] }
anyhow = "1"
chrono = "0.4"
formatx = "0.4"
fragile = "2"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
glib = { version = "0.22", features = ["v2_88"] }
gstreamer-play = "0.25"
gtk = { package = "gtk4", version = "0.11", features = ["v4_22", "blueprint"] }
log = "0.4"
mpris-server = "0.10"
musicus-library = { path = "musicus-library" }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = "0.3"
