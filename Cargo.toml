[package]
name = "musicus"
version = "0.1.0"
edition = "2021"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_9", "gtk_v4_22"] }
anyhow = "1"
async-channel = "2.3"
chrono = "0.4"
diesel = { version = "2.2", features = ["chrono", "sqlite"] }
diesel_migrations = "2.2"
formatx = "0.4"
fragile = "2"
futures-util = "0.3"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
glib = { version = "0.22", features = ["v2_88"] }
gstreamer-play = "0.25"
gtk = { package = "gtk4", version = "0.11", features = ["v4_22", "blueprint"] }
log = "0.4"
mpris-server = "0.10"
once_cell = "1"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "fs"] }
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
zip = "8"