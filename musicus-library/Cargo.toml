[package]
name = "musicus-library"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-channel = "2.3"
chrono = "0.4"
deunicode = "1"
diesel = { version = "2.2", features = ["chrono", "sqlite"] }
diesel_migrations = "2.2"
formatx = "0.4"
futures-util = "0.3"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
lofty = "0.25"
log = "0.4"
once_cell = "1"
rand = "0.10"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "fs"] }
uuid = { version = "1", features = ["v4"] }
zip = "8"
